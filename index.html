<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог софтов</title>

<style>
:root{
  --accent:#14b8a6;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI, sans-serif;
}

body{
  overflow-x:hidden;
  color:#1f2937;
  background:linear-gradient(-45deg,#dffcf8,#c7f5ef,#b2f0e8,#e6fffb);
  background-size:400% 400%;
  animation:gradient 15s ease infinite;
}

@keyframes gradient{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

h1{
  text-align:center;
  padding:30px;
  font-size:32px;
  color:var(--accent);
}

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

/* Плавающие фоновые круги */
.bg-circle{
  position:fixed;
  border-radius:50%;
  background:rgba(20,184,166,0.15);
  z-index:-1;
  animation:float 12s infinite ease-in-out;
}

.bg-circle:nth-child(1){
  width:220px;height:220px;
  top:60%;left:10%;
}

.bg-circle:nth-child(2){
  width:160px;height:160px;
  top:20%;left:75%;
  animation-duration:16s;
}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-40px)}
  100%{transform:translateY(0)}
}

/* Карточки */
.block{
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:25px;
  margin-bottom:35px;
  box-shadow:0 15px 35px rgba(0,0,0,0.1);
  text-align:center;
  opacity:0;
  transform:translateY(40px);
  animation:fadeUp 0.8s forwards;
}

.block:nth-child(1){animation-delay:0.2s}
.block:nth-child(2){animation-delay:0.4s}
.block:nth-child(3){animation-delay:0.6s}

@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.block:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 20px 45px rgba(0,0,0,0.15);
}

.block img{
  width:100%;
  max-width:260px;
  border-radius:15px;
  margin:15px 0;
}

.price{
  font-size:18px;
  margin:8px 0;
}

/* Таблица */
.table-wrap{
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:25px;
  box-shadow:0 15px 35px rgba(0,0,0,0.1);
  margin-top:20px;
  opacity:0;
  transform:translateY(40px);
  animation:fadeUp 0.8s forwards;
  animation-delay:0.8s;
}

table{
  width:100%;
  border-collapse:collapse;
  text-align:center;
}

th{
  color:var(--accent);
  padding:12px;
  font-size:18px;
}

td{
  padding:12px;
  border-top:1px solid #ddd;
}

/* Кнопка вверх */
.top-btn{
  position:fixed;
  bottom:25px;
  right:25px;
  background:var(--accent);
  color:white;
  border:none;
  border-radius:50%;
  width:55px;
  height:55px;
  font-size:22px;
  cursor:pointer;
  display:none;
  transition:0.3s;
}

.top-btn:hover{
  transform:scale(1.15);
}
</style>
</head>

<body>

<div class="bg-circle"></div>
<div class="bg-circle"></div>

<h1>Каталог софтов</h1>

<div class="container">

  <div class="block">
    <h2 style="color:var(--accent)">Zenin</h2>
    <img src="zenin.jpg" alt="Zenin">
    <div class="price">7 days – 4$</div>
    <div class="price">30 days – 6$</div>
    <div class="price">90 days – 17$</div>
  </div>

  <div class="block">
    <h2 style="color:var(--accent)">Plutonium</h2>
    <img src="plutonium.jpg" alt="Plutonium">
    <div class="price">7 days – 3.99$</div>
    <div class="price">30 days – 6.88$</div>
    <div class="price">90 days – 15$</div>
  </div>

  <div class="block">
    <h2 style="color:var(--accent)">NerestPC</h2>
    <img src="nerestpc.jpg" alt="NerestPC">
    <div class="price">14 days – 2.99$</div>
    <div class="price">30 days – 5.99$</div>
    <div class="price">90 days – 13.99$</div>
  </div>

  <div class="table-wrap">
    <h2 style="text-align:center;color:var(--accent)">Сравнение</h2>
    <table>
      <tr>
        <th>Софт</th>
        <th>Платформа</th>
        <th>Цена от</th>
        <th>Рейтинг</th>
      </tr>
      <tr>
        <td>Plutonium</td>
        <td>Android</td>
        <td>$3.99</td>
        <td>★★★★★</td>
      </tr>
      <tr>
        <td>NerestPC</td>
        <td>PC</td>
        <td>$2.99</td>
        <td>★★★★☆</td>
      </tr>
      <tr>
        <td>Zenin</td>
        <td>Android</td>
        <td>$4</td>
        <td>★★★★☆</td>
      </tr>
    </table>
  </div>

</div>

<button class="top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
window.addEventListener("scroll",function(){
  const btn=document.querySelector(".top-btn");
  btn.style.display = window.scrollY > 300 ? "block" : "none";
});
</script>

</body>
</html>
