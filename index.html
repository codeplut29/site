<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог проектов</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background: linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1c1c1c);
background-size:400% 400%;
animation:gradient 15s ease infinite;
color:white;
}

@keyframes gradient{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

header{
text-align:center;
padding:25px;
font-size:28px;
font-weight:bold;
}

.search-box{
text-align:center;
margin-bottom:20px;
}

.search-box input{
padding:10px;
width:80%;
max-width:400px;
border-radius:10px;
border:none;
outline:none;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border-radius:20px;
padding:20px;
width:300px;
text-align:center;
transition:0.3s;
position:relative;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
border-radius:15px;
margin-bottom:15px;
}

.card h2{
margin-bottom:10px;
}

.card p{
font-size:14px;
margin:4px 0;
}

.tag{
position:absolute;
top:15px;
left:15px;
background:#00c9a7;
padding:5px 10px;
border-radius:8px;
font-size:12px;
font-weight:bold;
}

button{
margin-top:10px;
padding:8px 15px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00c9a7;
color:black;
font-weight:bold;
transition:0.3s;
}

button:hover{
background:white;
}
</style>
</head>

<body>

<header>Каталог проектов</header>

<div class="search-box">
<input type="text" id="search" placeholder="Поиск..." onkeyup="searchFunction()">
</div>

<div class="container">

<!-- Zenin -->
<div class="card">
<span class="tag">Android</span>
<img src="zenin..jpg">
<h2>Zenin</h2>
<p><b>Цена:</b> от $4</p>
<p><b>Рейтинг:</b> ⭐⭐⭐⭐⭐</p>
<button onclick="alert('Zenin\n\nВерсия: 15.9\nПлатформа: Android\nСтатус: Stable\nИсточник: Official Dev')">
Подробнее
</button>
</div>

<!-- Plutonium -->
<div class="card">
<span class="tag">Android</span>
<img src="plutonium..jpg">
<h2>Plutonium</h2>
<p><b>Цена:</b> от $3.99</p>
<p><b>Рейтинг:</b> ⭐⭐⭐⭐⭐</p>
<button onclick="alert('Plutonium\n\nВерсия: 15.9\nПлатформа: Android\nСтатус: Stable\nИсточник: Official Dev')">
Подробнее
</button>
</div>

<!-- NerestPC -->
<div class="card">
<span class="tag">PC</span>
<img src="nerestpc..jpg">
<h2>NerestPC</h2>
<p><b>Цена:</b> от $2.99</p>
<p><b>Рейтинг:</b> ⭐⭐⭐⭐☆</p>
<button onclick="alert('NerestPC\n\nВерсия: 15.9\nПлатформа: Windows\nСтатус: Stable\nИсточник: Official Dev')">
Подробнее
</button>
</div>

</div>

<script>
function searchFunction(){
let input = document.getElementById("search").value.toLowerCase();
let cards = document.querySelectorAll(".card");

cards.forEach(card=>{
let title = card.querySelector("h2").innerText.toLowerCase();
if(title.includes(input)){
card.style.display="block";
}else{
card.style.display="none";
}
});
}
</script>

</body>
</html>
