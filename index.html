<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standoff Ultra Pro</title>

<style>
:root{
  --bg:#0a0a14;
  --card:rgba(255,255,255,0.05);
  --accent:#00f0ff;
  --accent2:#ff00c8;
  --text:#ffffff;
  --muted:#aaaaaa;
}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* SPACE BACKGROUND */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* HEADER */
header{
  text-align:center;
  padding:50px 20px 20px;
}

header h1{
  font-size:48px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

header p{
  color:var(--muted);
}

/* CONTROLS */
.controls{
  text-align:center;
  padding:20px;
}

input,select,button{
  padding:10px 15px;
  margin:5px;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:14px;
}

input{
  width:200px;
}

button{
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;
  font-weight:bold;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
}

/* GRID */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
  padding:40px;
}

/* CARD */
.card{
  background:var(--card);
  backdrop-filter:blur(15px);
  padding:25px;
  border-radius:25px;
  position:relative;
  transition:0.4s;
  border:1px solid rgba(255,255,255,0.1);
}

.card:hover{
  transform:translateY(-10px) rotateX(3deg);
  box-shadow:0 0 30px var(--accent);
}

.card h2{
  margin-top:0;
  color:var(--accent);
}

.rating{
  font-weight:bold;
  margin:5px 0;
}

.desc{
  font-size:14px;
  color:var(--muted);
}

.more{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.5s ease;
}

.card.active .more{
  max-height:400px;
  margin-top:10px;
}

.favorite{
  position:absolute;
  top:15px;
  right:20px;
  cursor:pointer;
  font-size:22px;
}

/* TOP BUTTON */
.topBtn{
  position:fixed;
  bottom:30px;
  right:30px;
  display:none;
  border-radius:50%;
  width:55px;
  height:55px;
  font-size:20px;
}

footer{
  text-align:center;
  padding:40px;
  color:var(--muted);
}
</style>
</head>
<body>

<canvas id="space"></canvas>

<header>
<h1>Standoff Ultra Pro</h1>
<p>GLOBAL 300% FINAL VERSION</p>
</header>

<div class="controls">
<input type="text" id="search" placeholder="Поиск..." onkeyup="filterCards()">
<select id="category" onchange="filterCards()">
<option value="all">All</option>
<option value="popular">Popular</option>
<option value="premium">Premium</option>
<option value="free">Free</option>
<option value="top">Top Rated</option>
<option value="new">New</option>
<option value="fav">Favorites</option>
</select>
<select onchange="sortCards(this.value)">
<option value="ratingDesc">Rating ↓</option>
<option value="ratingAsc">Rating ↑</option>
<option value="nameAsc">Name A-Z</option>
</select>
</div>

<div class="container" id="cards">

<div class="card" data-name="Alpha" data-rating="9.9" data-category="popular top">
<div class="favorite" onclick="toggleFav(this)">☆</div>
<h2>Alpha</h2>
<div class="rating">9.9/10</div>
<div class="desc">Топ популярный вариант</div>
<button onclick="toggleMore(this)">Подробнее</button>
<div class="more">Подробная информация внутри.</div>
</div>

<div class="card" data-name="Bravo" data-rating="8.7" data-category="premium">
<div class="favorite" onclick="toggleFav(this)">☆</div>
<h2>Bravo</h2>
<div class="rating">8.7/10</div>
<div class="desc">Premium версия</div>
<button onclick="toggleMore(this)">Подробнее</button>
<div class="more">Подробности о версии.</div>
</div>

<div class="card" data-name="FreeX" data-rating="7.5" data-category="free new">
<div class="favorite" onclick="toggleFav(this)">☆</div>
<h2>FreeX</h2>
<div class="rating">7.5/10</div>
<div class="desc">Бесплатный вариант</div>
<button onclick="toggleMore(this)">Подробнее</button>
<div class="more">Описание бесплатной версии.</div>
</div>

</div>

<button class="topBtn" onclick="scrollTop()">↑</button>

<footer>© 2026 Ultra Pro Standoff</footer>

<script>
/* TOGGLE */
function toggleMore(btn){btn.parentElement.classList.toggle("active");}

/* FILTER */
function filterCards(){
const search=document.getElementById("search").value.toLowerCase();
const category=document.getElementById("category").value;
document.querySelectorAll(".card").forEach(card=>{
let show=card.dataset.name.toLowerCase().includes(search);
if(category!=="all"){
if(category==="fav") show=show && card.classList.contains("fav");
else show=show && card.dataset.category.includes(category);
}
card.style.display=show?"block":"none";
});
}

/* SORT */
function sortCards(type){
const container=document.getElementById("cards");
const cards=[...container.children];
cards.sort((a,b)=>{
if(type==="ratingDesc") return b.dataset.rating-a.dataset.rating;
if(type==="ratingAsc") return a.dataset.rating-b.dataset.rating;
if(type==="nameAsc") return a.dataset.name.localeCompare(b.dataset.name);
});
cards.forEach(c=>container.appendChild(c));
}

/* FAVORITE */
function toggleFav(el){
const card=el.parentElement;
card.classList.toggle("fav");
el.textContent=card.classList.contains("fav")?"★":"☆";
}

/* SCROLL */
window.onscroll=function(){
document.querySelector(".topBtn").style.display=
window.scrollY>300?"block":"none";
}
function scrollTop(){window.scrollTo({top:0,behavior:"smooth"});}

/* SPACE PARTICLES */
const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let stars=[];
for(let i=0;i<120;i++){
stars.push({x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2});
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#ffffff";
stars.forEach(s=>{
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
s.y+=0.2;
if(s.y>canvas.height) s.y=0;
});
requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
